name: logmydailytask
description: Local-first personal worklog.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  characters: 1.4.1
  cupertino_ui: 1.1.6
  drift: 2.35.3
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: 23.0.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.5.0
  flutter_secure_storage: 11.2.0
  flutter_timezone: 5.1.1
  go_router: 18.1.4
  intl: 0.20.3
  material_ui: 1.11.0

  timezone: 0.11.2
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  drift_dev: 2.35.3
  build_runner: 2.17.1

flutter:
  generate: true
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
